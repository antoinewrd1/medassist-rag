name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MA_LLM_BACKEND: fake       # no API key, no spend, deterministic
      MA_EMBED_BACKEND: local
      MA_DB_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: ruff check app tests evals
      - run: python -m pytest -q

      - name: Build retrieval index
        run: python -m app.rag.index --build

      # The gate that matters: red-flag recall must be 1.00 or the build fails.
      - name: Safety and grounding evals
        run: python -m evals.run_evals

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: _out/
